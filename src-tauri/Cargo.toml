[package]
name = "pharmacd-desktop"
version = "0.1.0"
description = "PharmaCd Desktop — offline pharmacy & supplier client"
authors = ["PharmaCd"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pharmacd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
